# /etc/apache2/sites-available/hackathon.conf
#
# Drop this file in /etc/apache2/sites-available/, then:
#   sudo a2ensite hackathon
#   sudo a2enmod rewrite headers expires deflate
#   sudo systemctl reload apache2
#
# This serves the Laravel app at https://aiu.edu.eg/hackathon/
# It aliases the URL straight to public/ — no sub-URI rewrites needed.

Alias /hackathon /var/www/html/hackathon/public

<Directory /var/www/html/hackathon/public>
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride All
    Require all granted

    # Laravel front-controller fallback (works even if .htaccess is ignored)
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /hackathon/

        # Pass Authorization + X-XSRF-Token headers to PHP
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{HTTP:x-xsrf-token} .
        RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

        # Drop trailing slash on non-folders
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]

        # Front controller
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </IfModule>
</Directory>

# Belt-and-braces: deny direct access to the project root over the web,
# even though the alias above shouldn't expose it. If the project lives
# anywhere reachable through DocumentRoot, this prevents browsing.
<Directory /var/www/html/hackathon>
    Require all denied
</Directory>

<Directory /var/www/html/hackathon/public>
    Require all granted
</Directory>
