; PHP runtime overrides for cPanel / shared hosting (PHP-FPM / suPHP / CGI).
; Apache mod_php uses .htaccess php_value directives instead, but cPanel
; almost always runs PHP-FPM where .user.ini is the right knob.
;
; If these still don't take effect, set the same values in:
;   cPanel → MultiPHP INI Editor → (Editor mode) → select the domain.
;
; Cache TTL for .user.ini is 5 min by default (user_ini.cache_ttl), so changes
; may take up to 5 minutes to apply.

upload_max_filesize = 64M
post_max_size       = 64M
memory_limit        = 256M
max_execution_time  = 120
max_input_time      = 120
